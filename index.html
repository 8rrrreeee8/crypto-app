<span>تنظیم دستی قیمت تتر (تومان):</span>
            <input type="number" id="manual-usdt" class="manual-usdt-input" oninput="updateManualUsdt()">

<script>
    let btcPriceUsdt = 0;
    let usdtPriceToman = 0;
    let btcPriceTomanDirect = 0;
    let selectedCoin = 'BTC';

    const quickOptions = {
        BTC: [0.001, 0.01, 0.05, 0.1, 1],
        USDT: [10, 50, 100, 500, 1000]
    };

    function formatNumber(num, decimals = 0) {
        return Number(num).toLocaleString('en-US', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }

    function renderQuickButtons() {
        const container = document.getElementById('quick-buttons');
        container.innerHTML = '';
        quickOptions[selectedCoin].forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'quick-btn';
            btn.textContent = `+ ${val}`;
            btn.onclick = () => {
                const input = document.getElementById('amount-input');
                const current = parseFloat(input.value) || 0;
                input.value = Number((current + val).toFixed(6));
                calculate();
            };
            container.appendChild(btn);
        });
    }

    function selectCoin(coin) {
        selectedCoin = coin;
        document.getElementById('tab-btc').classList.toggle('active', coin === 'BTC');
        document.getElementById('tab-usdt').classList.toggle('active', coin === 'USDT');
        document.getElementById('input-coin-label').textContent = 
            coin === 'BTC' ? 'مقدار بیت‌کوین را وارد کنید:' : 'مقدار تتر را وارد کنید:';
        renderQuickButtons();
        calculate();
    }

    function clearInput() {
        document.getElementById('amount-input').value = '';
        calculate();
    }

    function updateManualUsdt() {
        const val = parseFloat(document.getElementById('manual-usdt').value);
        if (val > 0) {
            usdtPriceToman = val;
            btcPriceTomanDirect = btcPriceUsdt * usdtPriceToman;
            updateDisplayPrices();
            calculate();
        }
    }

    function updateDisplayPrices() {
        document.getElementById('btc-usdt-price').textContent = `${formatNumber(btcPriceUsdt, 1)} $`;
        document.getElementById('usdt-toman-price').textContent = `${formatNumber(usdtPriceToman)} ت`;
        const btcToman = btcPriceTomanDirect > 0 ? btcPriceTomanDirect : (btcPriceUsdt * usdtPriceToman);
        document.getElementById('btc-toman-price').textContent = `${formatNumber(Math.round(btcToman))} تومان`;
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount-input').value) || 0;
        let totalUsdt = 0;
        let totalToman = 0;

        if (selectedCoin === 'BTC') {
            totalUsdt = amount * btcPriceUsdt;
            totalToman = btcPriceTomanDirect > 0 ? (amount * btcPriceTomanDirect) : (totalUsdt * usdtPriceToman);
        } else {
            totalUsdt = amount;
            totalToman = totalUsdt * usdtPriceToman;
        }

        document.getElementById('res-usdt').textContent = `${formatNumber(totalUsdt, 2)} USDT`;
        document.getElementById('res-toman').textContent = `${formatNumber(Math.round(totalToman))} تومان`;
    }

    async function fetchWithCorsFallback(targetUrl) {
        // تلاش اول: اتصال مستقیم
        try {
            const directRes = await fetch(targetUrl);
            if (directRes.ok) return await directRes.json();
        } catch (e) {}

        // تلاش دوم: عبور از پراکسی برای رفع محدودیت CORS مرورگر
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const proxyRes = await fetch(proxyUrl);
        const proxyData = await proxyRes.json();
        return JSON.parse(proxyData.contents);
    }

    async function fetchPrices() {
        const statusEl = document.getElementById('status-msg');
        statusEl.textContent = 'در حال دریافت نرخ‌های لحظه‌ای از تبدیل...';

        try {
            const data = await fetchWithCorsFallback('https://api.tabdeal.org/r/plots/currency_prices/');
            
            // پشتیبانی از آرایه یا آبجکت در پاسخ تبدیل
            const list = Array.isArray(data) ? data : (data.results || Object.values(data));

            const btcUsdtMarket = list.find(m => m && (m.symbol === 'BTC_USDT' || m.name_en === 'BTC_USDT'));
            const usdtIrtMarket = list.find(m => m && (m.symbol === 'USDT_IRT' || m.name_en === 'USDT_IRT'));
            const btcIrtMarket = list.find(m => m && (m.symbol === 'BTC_IRT' || m.name_en === 'BTC_IRT'));

            if (btcUsdtMarket) btcPriceUsdt = parseFloat(btcUsdtMarket.price || btcUsdtMarket.last_trade_price);
            if (usdtIrtMarket) usdtPriceToman = Math.round(parseFloat(usdtIrtMarket.price || usdtIrtMarket.last_trade_price));
            if (btcIrtMarket) btcPriceTomanDirect = Math.round(parseFloat(btcIrtMarket.price || btcIrtMarket.last_trade_price));

            if (!btcPriceUsdt || !usdtPriceToman) {
                throw new Error('داده ناقص دریافت شد');
            }

            document.getElementById('manual-usdt').value = usdtPriceToman;
            updateDisplayPrices();
            calculate();

            const now = new Date().toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            statusEl.textContent = `بروزرسانی زنده از تبدیل: ${now}`;
        } catch (error) {
            statusEl.textContent = 'خطا در دریافت خودکار؛ اتصال اینترنت را بررسی یا نرخ تتر را دستی وارد کنید.';
            updateDisplayPrices();
            calculate();
        }
    }

    renderQuickButtons();
    fetchPrices();
</script>

            };
            container.appendChild(btn);
        });
    }

        selectedCoin = coin;
        document.getElementById('tab-btc').classList.toggle('active', coin === 'BTC');
        document.getElementById('tab-usdt').classList.toggle('active', coin === 'USDT');

            coin === 'BTC' ? 'مقدار بیت‌کوین را وارد کنید:' : 'مقدار تتر را وارد کنید:';
        renderQuickButtons();

        calculate();

        } else {
            totalUsdt = amount;
            totalToman = totalUsdt * usdtPriceToman;
        }

        document.getElementById('res-usdt').textContent = `${formatNumber(totalUsdt, 2)} USDT`;
        document.getElementById('res-toman').textContent = `${formatNumber(Math.round(totalToman))} تومان`;
    }

    async function fetchPrices() {
        const statusEl = document.getElementById('status-msg');
        statusEl.textContent = 'در حال دریافت نرخ‌ها از صرافی تبدیل...';

        try {
            // دریافت لیست بازارهای صرافی تبدیل
            const res = await fetch('https://api.tabdeal.org/r/plots/currency_prices/');
            const markets = await res.json();

            const btcUsdtMarket = markets.find(m => m.symbol === 'BTC_USDT');
            const usdtIrtMarket = markets.find(m => m.symbol === 'USDT_IRT');
            const btcIrtMarket = markets.find(m => m.symbol === 'BTC_IRT');

            if (btcUsdtMarket) btcPriceUsdt = parseFloat(btcUsdtMarket.price);
            if (usdtIrtMarket) usdtPriceToman = Math.round(parseFloat(usdtIrtMarket.price));
            if (btcIrtMarket) btcPriceTomanDirect = Math.round(parseFloat(btcIrtMarket.price));

            document.getElementById('manual-usdt').value = usdtPriceToman;
            updateDisplayPrices();
            calculate();

            const now = new Date().toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            statusEl.textContent = `بروزرسانی از تبدیل: ${now}`;
        } catch (error) {
            statusEl.textContent = 'خطا در اتصال به تبدیل؛ می‌توانید قیمت تتر را دستی وارد کنید.';
            if (btcPriceUsdt === 0) btcPriceUsdt = 90000;
            if (usdtPriceToman === 0) {
                usdtPriceToman = 70000;
                document.getElementById('manual-usdt').value = usdtPriceToman;
            }
            updateDisplayPrices();
            calculate();
        }
    }

    renderQuickButtons();
    fetchPrices();
</script>

            <input type="number" id="manual-usdt" class="manual-usdt-input" oninput="updateManualUsdt()">
        </div>
    </div>

    <div class="status-text" id="status-msg">در حال اتصال به سرور قیمت...</div>
</div>

<script>
    let btcPriceUsdt = 0;
    let usdtPriceToman = 0;
    let selectedCoin = 'BTC';

    const quickOptions = {
        BTC: [0.001, 0.01, 0.05, 0.1, 1],
        USDT: [10, 50, 100, 500, 1000]
    };

    function formatNumber(num, decimals = 0) {
        return Number(num).toLocaleString('en-US', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }

    function renderQuickButtons() {
        const container = document.getElementById('quick-buttons');
        container.innerHTML = '';
        quickOptions[selectedCoin].forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'quick-btn';
            btn.textContent = `+ ${val}`;
            btn.onclick = () => {
                const input = document.getElementById('amount-input');
                const current = parseFloat(input.value) || 0;
                input.value = Number((current + val).toFixed(6));
                calculate();
            };
            container.appendChild(btn);
        });
    }

    function selectCoin(coin) {
        selectedCoin = coin;
        document.getElementById('tab-btc').classList.toggle('active', coin === 'BTC');
        document.getElementById('tab-usdt').classList.toggle('active', coin === 'USDT');
        document.getElementById('input-coin-label').textContent = 
            coin === 'BTC' ? 'مقدار بیت‌کوین را وارد کنید:' : 'مقدار تتر را وارد کنید:';
        renderQuickButtons();
        calculate();
    }

    function clearInput() {
        document.getElementById('amount-input').value = '';
        calculate();
    }

    function updateManualUsdt() {
        const val = parseFloat(document.getElementById('manual-usdt').value);
        if (val > 0) {
            usdtPriceToman = val;
            updateDisplayPrices();
            calculate();
        }
    }

    function updateDisplayPrices() {
        document.getElementById('btc-usdt-price').textContent = `${formatNumber(btcPriceUsdt, 1)} $`;
        document.getElementById('usdt-toman-price').textContent = `${formatNumber(usdtPriceToman)} ت`;
        const btcToman = btcPriceUsdt * usdtPriceToman;
        document.getElementById('btc-toman-price').textContent = `${formatNumber(btcToman)} تومان`;
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount-input').value) || 0;
        let totalUsdt = 0;

        if (selectedCoin === 'BTC') {
            totalUsdt = amount * btcPriceUsdt;
        } else {
            totalUsdt = amount;
        }

        const totalToman = totalUsdt * usdtPriceToman;

        document.getElementById('res-usdt').textContent = `${formatNumber(totalUsdt, 2)} USDT`;
        document.getElementById('res-toman').textContent = `${formatNumber(Math.round(totalToman))} تومان`;
    }

    async function fetchPrices() {
        const statusEl = document.getElementById('status-msg');
        statusEl.textContent = 'در حال دریافت نرخ‌های لحظه‌ای...';

        try {
            // دریافت قیمت بیت‌کوین از بایننس
            const btcRes = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
            const btcData = await btcRes.json();
            btcPriceUsdt = parseFloat(btcData.price);

            // دریافت قیمت تتر به تومان از نوبیتکس
            const usdtRes = await fetch('https://api.nobitex.ir/v2/orderbook/USDTIRT');
            const usdtData = await usdtRes.json();
            if (usdtData && usdtData.lastTradePrice) {
                usdtPriceToman = Math.round(parseFloat(usdtData.lastTradePrice) / 10);
            }

            document.getElementById('manual-usdt').value = usdtPriceToman;
            updateDisplayPrices();
            calculate();

            const now = new Date().toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            statusEl.textContent = `آخرین بروزرسانی موفق: ${now}`;
        } catch (error) {
            statusEl.textContent = 'خطا در دریافت خودکار؛ می‌توانید قیمت تتر را دستی وارد کنید.';
            if (btcPriceUsdt === 0) btcPriceUsdt = 90000;
            if (usdtPriceToman === 0) {
                usdtPriceToman = 70000;
                document.getElementById('manual-usdt').value = usdtPriceToman;
            }
            updateDisplayPrices();
            calculate();
        }
    }

    renderQuickButtons();
    fetchPrices();
</script>
